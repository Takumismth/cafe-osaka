<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Галерея — Osaka Coffee</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .gallery-hero { padding: 80px 0 40px; text-align: center; }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      padding-bottom: 80px;
    }
    .gallery-item {
      border-radius: 16px;
      overflow: hidden;
      aspect-ratio: 1;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }
    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s;
      display: block;
    }
    .gallery-item:hover img { transform: scale(1.05); }
    .gallery-item.wide { grid-column: span 2; aspect-ratio: 2/1; }
    @media (max-width: 700px) {
      .gallery-grid { grid-template-columns: 1fr 1fr; }
      .gallery-item.wide { grid-column: span 2; }
    }
    @media (max-width: 480px) {
      .gallery-grid { grid-template-columns: 1fr; }
      .gallery-item.wide { grid-column: span 1; aspect-ratio: 1; }
    }
  </style>
</head>
<body class="light">
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo" id="logo">
        <div class="logo-icon">🇯🇵</div>
        <div class="logo-text">Osaka</div>
      </a>
      <nav class="nav" id="nav">
        <a href="index.html#menu" class="nav-link">Меню</a>
        <a href="gallery.html" class="nav-link">Галерея</a>
        <a href="events.html" class="nav-link">События</a>
        <a href="guide.html" class="nav-link">Кофе-гид</a>
        <a href="index.html#contacts" class="nav-link">Контакты</a>
      </nav>
      <div class="header-right">
        <button class="theme-btn" id="theme-btn">🌓</button>
        <button class="burger" id="burger"><span></span><span></span><span></span></button>
      </div>
    </div>
  </header>

  <section class="gallery-hero container">
    <h1 class="section-title">Галерея</h1>
    <p class="section-subtitle">Атмосфера Osaka Coffee</p>
  </section>

  <div class="container gallery-grid">
    <div class="gallery-item wide">
      <img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=1200&h=600&fit=crop" alt="Кофейня">
    </div>
    <div class="gallery-item">
      <img src="https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?w=600&h=600&fit=crop" alt="Интерьер">
    </div>
    <div class="gallery-item">
      <img src="https://images.unsplash.com/photo-1442512115166-2ea2b5d8a0d0?w=600&h=600&fit=crop" alt="Бариста">
    </div>
    <div class="gallery-item">
      <img src="https://images.unsplash.com/photo-1511920170033-f8396924c348?w=600&h=600&fit=crop" alt="Зёрна">
    </div>
    <div class="gallery-item wide">
      <img src="https://images.unsplash.com/photo-1554118811-1e0d58224f24?w=1200&h=600&fit=crop" alt="Зал">
    </div>
    <div class="gallery-item">
      <img src="https://images.unsplash.com/photo-1498804103079-a6351b050096?w=600&h=600&fit=crop" alt="Напиток">
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <div class="footer-logo">🇯🇵 Osaka Coffee</div>
      <p>© 2026 Osaka Coffee</p>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
