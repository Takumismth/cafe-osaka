<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Osaka • Coffee</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="logo">
        <div class="logo-icon">🦒</div>
        <div class="logo-text">Osaka coffee</div>
    </div>

    <h1 class="title">КОФЕ</h1>

    <div class="menu">
        <div class="item">
            <div class="cup mango">
                <div class="pearls">
                    <div class="pearl"></div>
                    <div class="pearl"></div>
                    <div class="pearl"></div>
                    <div class="pearl"></div>
                </div>
            </div>
            <div class="name">Латте<br>«Карамель»</div>
            <div class="price">260</div>
        </div>

        <div class="item">
            <div class="cup classic">
                <div class="pearls">
                    <div class="pearl"></div>
                    <div class="pearl"></div>
                    <div class="pearl"></div>
                    <div class="pearl"></div>
                </div>
            </div>
            <div class="name">Классический<br>Капучино</div>
            <div class="price">230</div>
        </div>

        <div class="item">
            <div class="cup dragon">
                <div class="pearls">
                    <div class="pearl"></div>
                    <div class="pearl"></div>
                    <div class="pearl"></div>
                    <div class="pearl"></div>
                </div>
            </div>
            <div class="name">Матча<br>Латте</div>
            <div class="price">270</div>
        </div>

        <div class="item">
            <div class="cup oreo">
                <div class="pearls">
                    <div class="pearl"></div>
                    <div class="pearl"></div>
                    <div class="pearl"></div>
                    <div class="pearl"></div>
                </div>
            </div>
            <div class="name">Раф<br>Ванильный</div>
            <div class="price">270</div>
        </div>

        <div class="item">
            <div class="cup matcha">
                <div class="pearls">
                    <div class="pearl"></div>
                    <div class="pearl"></div>
                    <div class="pearl"></div>
                    <div class="pearl"></div>
                </div>
            </div>
            <div class="name">Флэт Уайт</div>
            <div class="price">260</div>
        </div>

        <div class="item">
            <div class="cup matcha-oreo">
                <div class="pearls">
                    <div class="pearl"></div>
                    <div class="pearl"></div>
                    <div class="pearl"></div>
                    <div class="pearl"></div>
                </div>
            </div>
            <div class="name">Мокко<br>Шоколадный</div>
            <div class="price">300</div>
        </div>
    </div>

    <div class="footer">
        *Напитки могут иметь незначительные визуальные отличия.<br>
        Напитки без льда могут отличаться по объёму.
    </div>

</body>
</html>
